seed: 42
num_steps_per_env: 24
max_iterations: 5000
obs_groups:
  actor: !!python/tuple
  - actor
  critic: !!python/tuple
  - critic
save_interval: 50
experiment_name: g1_amp_get_up_no_keybody_robust_separate
run_name: low_height_progress_from_14999_gpu3_5000
logger: tensorboard
wandb_project: mjlab
wandb_tags: !!python/tuple []
resume: true
load_run: ^2026-09-29_15-01-41_fresh_old8_4096_15000$
load_checkpoint: ^model_14999[.]pt$
clip_actions: 3.5
upload_model: false
class_name: OnPolicyRunner
actor:
  hidden_dims: !!python/tuple
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  cnn_cfg: null
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 1.0
    std_type: scalar
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: MLPModel
critic:
  hidden_dims: !!python/tuple
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  cnn_cfg: null
  distribution_cfg: null
  rnn_type: null
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  class_name: MLPModel
algorithm:
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  optimizer: adam
  share_cnn_encoders: false
  class_name: g1recovery_amp.tasks.recovery.rl.algorithm:AmpPPO
  amp_cfg:
    step_dt: 0.02
    replay_buffer_length: 244
    discriminator:
      frame_dim: 85
      history_length: 10
      hidden_dims: !!python/tuple
      - 1024
      - 512
      negative_slope: 0.01
      style_reward_scale: 50.0
      task_style_lerp: 0.5
      normalization_clip: 10.0
      normalization_eps: 0.0001
      normalization_until: 100000000
    optimizer:
      learning_rate: 0.001
      trunk_weight_decay: 0.001
      output_weight_decay: 0.1
      gradient_penalty_scale: 10.0
      max_gradient_norm: 1.0
